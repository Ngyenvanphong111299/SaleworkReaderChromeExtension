<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salework Crawler</title>
  <style>
    /* ===== CSS Variables ===== */
    :root {
      --bg-primary: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --bg-card: rgba(30, 41, 59, 0.7);
      --bg-card-hover: rgba(51, 65, 85, 0.8);
      --border-color: rgba(71, 85, 105, 0.5);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --accent-red: #ef4444;
      --accent-red-hover: #dc2626;
      --accent-purple: #8b5cf6;
      --shadow-blue: rgba(59, 130, 246, 0.25);
      --shadow-green: rgba(16, 185, 129, 0.25);
      --shadow-red: rgba(239, 68, 68, 0.25);
    }

    /* ===== Reset & Base ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 360px;
      min-height: 100vh;
      padding: 16px;
      background: var(--bg-primary);
      color: var(--text-primary);
    }

    /* ===== Header ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px var(--shadow-blue);
    }

    .logo svg {
      width: 24px;
      height: 24px;
      color: white;
    }

    .header-info h1 {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .header-info p {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      background: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    .status-badge.active {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.3);
    }

    .status-badge.processing {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border-color: rgba(59, 130, 246, 0.3);
      animation: pulse 2s infinite;
    }

    .status-badge.error {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* ===== Stats Cards ===== */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      backdrop-filter: blur(8px);
    }

    .stat-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .stat-card-header svg {
      width: 16px;
      height: 16px;
    }

    .stat-card-header.blue svg { color: #60a5fa; }
    .stat-card-header.green svg { color: #34d399; }

    .stat-card-header span {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
    }

    .stat-value.blue { color: #60a5fa; }
    .stat-value.green { color: #34d399; }

    /* ===== Input & Buttons ===== */
    .control-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      backdrop-filter: blur(8px);
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="number"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      background: rgba(15, 23, 42, 0.5);
      color: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    input[type="number"]::placeholder {
      color: var(--text-muted);
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    .btn-start {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 12px var(--shadow-green);
    }

    .btn-start:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px var(--shadow-green);
    }

    .btn-start:active {
      transform: scale(0.98);
    }

    .btn-stop {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      box-shadow: 0 4px 12px var(--shadow-red);
    }

    .btn-stop:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px var(--shadow-red);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    /* ===== Status ===== */
    .status {
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .status.show { display: flex; }

    .status.success {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status.error {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .status.processing {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    /* ===== Log Container ===== */
    .log-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
    }

    .log-header {
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.3);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .log-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .log-header svg {
      width: 16px;
      height: 16px;
      color: var(--text-secondary);
    }

    .log-header span {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .log-clear {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .log-clear:hover {
      color: var(--text-secondary);
    }

    .log-list {
      max-height: 280px;
      overflow-y: auto;
      padding: 12px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 11px;
    }

    /* Custom Scrollbar */
    .log-list::-webkit-scrollbar {
      width: 5px;
    }

    .log-list::-webkit-scrollbar-track {
      background: #1e293b;
    }

    .log-list::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }

    .log-item {
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 2px;
      color: #cbd5e1;
    }

    .log-item:hover {
      background: rgba(51, 65, 85, 0.3);
    }

    .log-time {
      color: #64748b;
      margin-right: 6px;
    }

    .log-item.error { color: #f87171; }
    .log-item.warn { color: #fbbf24; }
    .log-item.success { color: #34d399; }
    .log-item.info { color: #60a5fa; }

    /* ===== Spinner ===== */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== Footer ===== */
    .footer {
      margin-top: 16px;
      text-align: center;
    }

    .footer p {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ===== Utility ===== */
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
      </div>
      <div class="header-info">
        <h1>Salework Crawler</h1>
        <p>v2.0 - Auto Message</p>
      </div>
    </div>
    <div id="statusBadge" class="status-badge">Sẵn sàng</div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-card-header blue">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
        </svg>
        <span>Tổng đơn</span>
      </div>
      <div id="totalOrders" class="stat-value blue">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-header green">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
        <span>Đã xử lý</span>
      </div>
      <div id="processedOrders" class="stat-value green">0</div>
    </div>
  </div>

  <!-- Buttons -->
  <div class="control-card">
    <button id="startBtn" class="btn btn-start" style="width: 100%;">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      Bắt Đầu Crawl
    </button>
    <button id="stopBtn" class="btn btn-stop hidden" style="width: 100%; margin-top: 8px;">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" />
      </svg>
      Dừng Crawl
    </button>
  </div>

  <!-- Manual Search -->
  <div class="control-card">
    <div class="input-group">
      <label>Nhập SDT để test thủ công</label>
      <div class="input-row">
        <input type="text" id="manualPhoneInput" value="0909168466" placeholder="VD: 0948687079" />
        <button id="manualSearchBtn" class="btn btn-start" style="background: linear-gradient(135deg, #3b82f6, #2563eb);">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          Search
        </button>
      </div>
    </div>
  </div>
  </div>

  <!-- Status -->
  <div id="status" class="status"></div>

  <!-- Log -->
  <div class="log-container">
    <div class="log-header">
      <div class="log-header-left">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <span>Nhật ký hoạt động</span>
      </div>
      <button id="clearLogBtn" class="log-clear">Xóa log</button>
    </div>
    <div id="logList" class="log-list"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <p>Cần mở tab Salework để crawl tin nhắn</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
