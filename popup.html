<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salework Crawler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 300px;
      min-height: 100vh;
      padding: 16px;
      background: #1e1e1e;
      color: #fff;
    }

    h2 { font-size: 18px; margin-bottom: 16px; color: #4a90d9; }

    .input-group { margin-bottom: 12px; }
    
    label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #444;
      border-radius: 6px;
      font-size: 14px;
      background: #2d2d2d;
      color: #fff;
    }

    input:focus { outline: none; border-color: #4a90d9; }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-primary { background: #4a90d9; color: white; }
    .btn-primary:hover { background: #3a7bc8; }
    
    .btn-success { background: #28a745; color: white; }
    .btn-success:hover { background: #218838; }
    
    .btn-danger { background: #dc3545; color: white; }
    .btn-danger:hover { background: #c82333; }
    
    .btn-secondary { background: #6c757d; color: white; }

    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }

    .status.show { display: block; }
    .status.success { background: #28a745; color: #fff; }
    .status.error { background: #dc3545; color: #fff; }
    .status.processing { background: #ffc107; color: #000; }

    .info-box {
      margin-top: 16px;
      padding: 12px;
      background: #2d2d2d;
      border-radius: 6px;
      font-size: 12px;
    }

    .info-box .title {
      font-weight: 600;
      color: #4a90d9;
      margin-bottom: 8px;
    }

    .log-container {
      margin-top: 16px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #1e1e1e;
      overflow: hidden;
    }

    .log-header {
      padding: 8px 12px;
      background: #2d2d2d;
      border-bottom: 1px solid #444;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .log-list {
      max-height: 400px;
      overflow-y: auto;
      padding: 8px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 11px;
      color: #0f0;
    }

    .log-item { margin-bottom: 4px; }
    .log-time { color: #888; margin-right: 6px; }
    .log-item.error { color: #ff6b6b; }
    .log-item.warn { color: #ffd93d; }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #ccc;
      border-top-color: #4a90d9;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .stat-item {
      background: #2d2d2d;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }

    .stat-value { font-size: 20px; font-weight: bold; color: #4a90d9; }
    .stat-label { font-size: 11px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <h2>Salework Crawler v2.0</h2>

  <div class="input-group">
    <label>Số lượng đơn crawl:</label>
    <input type="text" id="limitInput" value="10" />
  </div>

  <button id="startBtn" class="btn-success">
    Bắt Đầu Crawl
  </button>

  <button id="stopBtn" class="btn-danger" style="display:none;">
    Dừng Lại
  </button>

  <div id="status" class="status"></div>

  <div class="stats">
    <div class="stat-item">
      <div class="stat-value" id="totalOrders">0</div>
      <div class="stat-label">Tổng Đơn</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="processedOrders">0</div>
      <div class="stat-label">Đã Xử Lý</div>
    </div>
  </div>

  <div class="log-container">
    <div class="log-header">
      <span>Nhật ký</span>
      <button id="clearLogBtn" style="width:auto;padding:2px 8px;font-size:10px;margin:0;background:#6c757d;">Xóa</button>
    </div>
    <div id="logList" class="log-list"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
